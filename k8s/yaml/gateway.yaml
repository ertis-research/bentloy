# ============================================================
# GATEWAY STACK (ServiceAccount + RBAC + Deployment + Service)
#
# Apply this file as-is with:
#   kubectl apply -f k8s/yaml/gateway.yaml
#
# Common customizations:
# 1) image: set the tag you just built with build_images scripts
# 2) namespace: change it if you do not use api-models
# 3) imagePullSecrets.name: update if your secret name is different
# 4) MLFLOW_TRACKING_URI / REGISTRY_SERVER / TU_ORG / MODEL_BASE_IMAGE
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  # Change only if you use a different namespace.
  namespace: api-models
  # Usually this name does not need to change.
  name: gateway-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: api-models
  # Internal role name used by gateway for service discovery
  # and deployment job orchestration.
  name: gateway-service-discovery
rules:
  # Permissions to read/list/watch model Services and Pods.
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Permission to read pod logs for deployment diagnostics.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Permissions over model Deployments.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Permissions for build Job lifecycle.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: api-models
  # Must match the Role name above.
  name: gateway-service-discovery
subjects:
  - kind: ServiceAccount
    # Must match ServiceAccount metadata.name.
    name: gateway-sa
    namespace: api-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  # Must match Role metadata.name.
  name: gateway-service-discovery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Gateway deployment name.
  name: gateway
  namespace: api-models
  labels:
    app: gateway
spec:
  # Initial scale (use 2+ for high availability).
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # Must exist (defined above).
      serviceAccountName: gateway-sa
      imagePullSecrets:
        # IMPORTANT: docker-registry secret name in Kubernetes.
        # Change if your secret has a different name.
        - name: model-registry-creds
      containers:
        - name: gateway
          # IMPORTANT: set the exact image you just published.
          # Example with explicit tag:
          #   registry.example.com/api-models/model-gateway:20260415-1015
          image: registry.example.com/api-models/model-gateway:20260416-02
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Model service prefix: model-<slug>
            - name: MODEL_SERVICE_PREFIX
              value: "model"
            # Namespace where gateway discovers model services.
            - name: MODEL_NAMESPACE
              value: "api-models"
            # Internal URL template for model services.
            - name: MODEL_URL_TEMPLATE
              value: "http://{service_name}:3000"
            # IMPORTANT: real MLflow URL for your environment.
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow.example.com:5000"
            # Registry settings used by the auto-deploy flow.
            - name: REGISTRY_SERVER
              value: "registry.example.com"
            - name: TU_ORG
              value: "api-models"
            # Base image used to build model-specific images.
            - name: MODEL_BASE_IMAGE
              value: "registry.example.com/api-models/model-service-base:py310"
            # Secret used by Kubernetes image pull/build flows.
            - name: MODEL_REGISTRY_SECRET
              value: "model-registry-creds"
            # Kaniko image used by automatic model image builds.
            - name: KANIKO_IMAGE
              value: "gcr.io/kaniko-project/executor:v1.23.2-debug"
            # Set to 1 for registries with self-signed certificates.
            - name: KANIKO_SKIP_TLS_VERIFY
              value: "1"
            # Keep enabled for dynamic model deployment from gateway.
            - name: AUTO_DEPLOY_ENABLED
              value: "1"
            # Build and rollout timeouts for deployment operations.
            - name: DEPLOY_BUILD_TIMEOUT_SEC
              value: "1800"
            - name: DEPLOY_ROLLOUT_TIMEOUT_SEC
              value: "300"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: api-models
  labels:
    app: gateway
spec:
  # LoadBalancer exposes gateway outside the cluster (if supported).
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      # Service external port.
      port: 8000
      # Gateway container internal port.
      targetPort: 3000
