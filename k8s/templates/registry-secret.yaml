# Image pull/push credentials used by the gateway, Kaniko build jobs and model pods.
# Rendered by `python bentloy.py up` from REGISTRY_SERVER / REGISTRY_USERNAME / REGISTRY_PASSWORD.
# Skipped when those credentials are not set (secret managed externally).
apiVersion: v1
kind: Secret
metadata:
  name: ${registry_secret}
  namespace: ${namespace}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ${dockerconfigjson}
