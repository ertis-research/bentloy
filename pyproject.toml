[project]
name = "bentloy"
version = "0.1.0"
description = "BentoML gateway and model service to deploy MLflow models on Kubernetes."
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with gateway/requirements.txt and model_service/requirements.txt
# (those files are what the Docker images install).
dependencies = [
    "bentoml>=1.3.18",
    "kubernetes_asyncio",
    "mlflow-skinny==3.17.2",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow<24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = [
    # Third-party deprecations raised while bentoml / pathspec are imported.
    "ignore:GitWildMatchPattern:DeprecationWarning:pathspec",
    "ignore:The `__get_pydantic_core_schema__` method:DeprecationWarning:_bentoml_sdk",
]
