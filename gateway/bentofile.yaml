service: "service:GatewayService"
description: "BentoML gateway that routes predictions to deployed models"
include:
  - "service.py"
  - "app/**/*.py"
  - "app/**/*.yaml"
  - "app/**/*.yml"
  - "app/**/*.sh"
python:
  requirements_txt: "requirements.txt"
docker:
  distro: debian
  python_version: "3.10"
