apiVersion: batch/v1
kind: Job
metadata:
  name: default-name
  namespace: default-namespace
  labels:
    app: delete-image
    model-slug: default-slug
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template: 
    metadata:
      labels:
        app: delete-image
        model-slug: default-slug
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: crane
          image: "gcr.io/go-containerregistry/crane:debug"
          command: ["crane", "delete", "default-image-ref"]
          volumeMounts: 
            - name: registry-creds
              mountPath: /root/.docker
      volumes:
        - name: registry-creds
          secret:
            secretName: default-secret
            items:
              - key: .dockerconfigjson
                path: config.json