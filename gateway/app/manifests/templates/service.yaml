# Base template used by gateway manifest builders.
apiVersion: v1
kind: Service
metadata:
  name: model-service-placeholder
  namespace: default
  labels:
    app: model-service
    model-slug: placeholder
spec:
  type: ClusterIP
  selector:
    app: model-service
    model-slug: placeholder
  ports:
    - name: http
      port: 3000
      targetPort: 3000
